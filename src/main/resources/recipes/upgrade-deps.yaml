id: builtin-upgrade-deps
name: 升级依赖
version: "1"
description: 升级一个 npm 依赖到最新稳定版，更新 package.json 与 lock 文件。
tags:
  - builtin
  - dependencies
inputs:
  - name: package-name
    label: 包名
    type: string
    required: true
    description: 要升级的包名
  - name: target-version
    label: 目标版本
    type: string
    required: false
    default: latest
    description: 目标版本（默认 latest）
  - name: run-install
    label: 执行 npm install
    type: boolean
    required: false
    default: true
    description: 是否执行 npm install 同步 lockfile
steps:
  - id: upgrade-dependency
    name: 升级依赖并同步 lockfile
    kind: agent
    agent_type: implement
    description: 升级指定 npm 依赖的版本约束并同步 lockfile
    adapter_name: claude-code
    prompt: |
      你是一位 Node.js 工程师。升级依赖 ${input.package-name} 到 ${input.target-version}。

      是否执行 npm install 同步 lockfile：${input.run-install}

      工作流：
      1. 阅读 package.json 与 lockfile 确认当前版本
      2. 更新 package.json 中的版本约束
      3. 执行 npm install 同步 lockfile
      4. 运行项目 lint/typecheck/test 确认未破坏
      5. 报告：before/after 版本 + 改动文件清单

      约束：
      - 不主动升级主版本号（major bump）除非用户显式要求
      - lockfile 与 package.json 保持一致

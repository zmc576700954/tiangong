version: "1.0.0"
title: "升级依赖"
description: "升级一个 npm 依赖到最新稳定版，更新 package.json 与 lock 文件。"
parameters:
  - key: packageName
    inputType: string
    required: true
    description: "要升级的包名"
  - key: targetVersion
    inputType: string
    required: false
    description: "目标版本（不填则取 latest）"
  - key: runInstall
    inputType: boolean
    required: false
    default: true
    description: "是否执行 npm install"
instructions: |
  你是一位 Node.js 工程师。
  升级 {{ packageName }} 到最新稳定版（{{ targetVersion || 'latest' }}）。

  工作流：
  1. 阅读 package.json 与 lockfile 确认当前版本
  2. 决定 target version（latest 还是指定版本）
  3. 更新 package.json 中的版本约束
  4. 执行 `npm install` 同步 lockfile（{{ runInstall ? '是' : '否（仅改 package.json）' }}）
  5. 运行项目 lint/typecheck/test 确认未破坏
  6. 报告：before/after 版本 + 改动文件清单

  约束：
  - 不主动升级主版本号（major bump）除非用户显式要求
  - lockfile 与 package.json 保持一致
prompt: "升级依赖 {{ packageName }}{{ targetVersion ? ' 到 ' + targetVersion : ' 到最新版' }}。是否执行 npm install：{{ runInstall }}。"
defaultAdapter: "claude-code"
scopeStrategy: "subset"
allowedTools: ["Read", "Edit", "Bash", "Glob"]
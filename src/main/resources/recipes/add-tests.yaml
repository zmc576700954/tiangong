id: builtin-add-tests
name: 添加单元测试
version: "1"
description: 为指定源文件添加一组单元测试，覆盖主流程与边界条件。
tags:
  - builtin
  - testing
inputs:
  - name: source-path
    label: 源文件路径
    type: string
    required: true
    description: 要测试的源文件路径（相对项目根）
  - name: test-framework
    label: 测试框架
    type: string
    required: false
    default: vitest
    description: 测试框架（vitest / jest / mocha）
steps:
  - id: write-tests
    name: 编写单元测试
    kind: agent
    agent_type: implement
    description: 读取目标文件并生成覆盖主流程与边界的单元测试
    adapter_name: claude-code
    prompt: |
      你是一位测试工程师。为目标源文件编写单元测试，遵循项目现有测试规范。

      目标文件：${input.source-path}
      测试框架：${input.test-framework}

      硬性约束：
      - 不修改产品代码（仅添加/修改测试文件）
      - 测试函数命名清晰表达意图（it('returns X when Y')）
      - 覆盖：主流程 + 至少 1 个边界 + 1 个错误路径
      - 不引入新的测试依赖（用项目已有的框架）

      工作流：
      1. 检查项目测试目录结构（__tests__/、*.test.ts、spec/）
      2. 阅读目标文件 + 其依赖
      3. 在合适位置创建/补充测试文件
      4. 运行测试套件确认通过

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # verify:blueprint 会用 `git cat-file -e <sha>` 核对蓝图里引用的历史提交号，
      # 而 actions/checkout 默认 shallow（depth=1）只带当前提交，历史 sha 一律解析失败
      # → 该断言在 CI 上必然误红。这里拉全量历史（本仓 .git 仅 ~60MB）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # lint 只跑 eslint/tsc/蓝图断言：不启动 Electron、也不加载原生模块，
      # 因此跳过全部安装脚本（--ignore-scripts）。这一步同时关掉两个纯网络性失败点：
      #   ① electron 二进制下载（走 github release，~110MB）；
      #   ② 根 postinstall = `electron-builder install-app-deps`，会用 node-gyp 按
      #      Electron ABI 重编 better-sqlite3，还得额外拉 headers。
      # 失败时把 npm 的真实输出尾部送进注解：npm 的 `_logs/*-debug-0.log` 里并不含
      # `npm error` 行（那是 CLI 的 stderr 格式），此前按它 grep 只会抓到空。
      - name: npm ci（lint 不需要安装脚本与原生构建）
        shell: bash
        run: |
          set -o pipefail
          npm ci --ignore-scripts 2>&1 | tee /tmp/npm-ci.log || {
            TAIL=$(tail -40 /tmp/npm-ci.log | tr '\n' '|' | cut -c1-900)
            echo "::error file=package-lock.json::npm ci failed: ${TAIL}"
            exit 1
          }
      - run: npm run lint
      - run: npx tsc --noEmit
      # 蓝图的机械断言（I.2 行数/编号闭合、计数三等式、文件与提交号可解析、
      # 行数声明=实测）。纯 node 脚本、秒级，防止文档口径随代码漂移。
      - run: npm run verify:blueprint

  # G4-9：vitest 单测。先以 continue-on-error 观测，不直接卡门。
  # 现状（2026-11-12，本地 Node 22 / macOS，--maxWorkers=4 实测）：
  #   384 文件（379 通过 / 5 整文件 skip）；4563 例（4517 通过 / 46 skip / 0 失败）；
  #   单次耗时约 5'20"（transform 54s，import 286s）。
  # ubuntu-latest 上的已知情况（#88 首次真跑到这一层）：
  #   - better-sqlite3 按 Node ABI 重建成功（66s），原生依赖不是问题；
  #   - vitest 只跑了 68s 就失败——不是「全量跑完有失败」，是早崩（收集/启动阶段），
  #     日志需 admin 权限才能读，故本步失败时把尾部写进注解，下一轮据此定位；
  #   - 进程归属类用例在 Linux 上会**首次真跑**（本机 ps 被拒 → 一直是 skip）。
  # 观测一轮全绿后，删除 continue-on-error 正式作为门禁。
  unit:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 同 lint：跳过安装脚本，避免根 postinstall 按 Electron ABI 重编原生模块；
      # 但单测跑在 Node 20 上、真的要用 better-sqlite3，故按 Node ABI 单独重建这一个。
      - name: npm ci（跳过安装脚本）
        run: npm ci --ignore-scripts
      - name: 按 Node ABI 重建 better-sqlite3
        run: npm rebuild better-sqlite3
      # --maxWorkers=4 与本地已验证的跑法一致：默认并发在本机会因 worker 起不来
      # 静默丢测试文件（342 vs 384），显式限并发才能拿到可信的「全量」。
      # #89 在 Linux 上是「真跑完但有失败」（[4/39]…），而 Actions 的 job 日志要
      # admin 权限（403），注解是匿名唯一可读的通道，且每步上限 10 个 error 注解——
      # 所以这里把失败用例按文件去重后逐条写进注解，附一条含末段日志的汇总。
      - name: Run unit tests (vitest, includes tests/migration P1–P9 / G4-6)
        shell: bash
        run: |
          set -o pipefail
          npx vitest run --reporter=default --maxWorkers=4 2>&1 | tee /tmp/vitest.log || {
            FAILS=$(grep -aE '^ *FAIL ' /tmp/vitest.log | sed -E 's/^ *FAIL +//' || true)
            COUNT=$(printf '%s\n' "$FAILS" | grep -c . || true)
            printf '%s\n' "$FAILS" | awk '!seen[$0]++' | head -8 | while IFS= read -r line; do
              [ -z "$line" ] && continue
              f=${line%% *}
              case "$f" in *.test.*) : ;; *) f=tests/vitest ;; esac
              echo "::error file=${f}::${line}"
            done
            TAIL=$(tail -25 /tmp/vitest.log | tr '\n' '|' | cut -c1-700)
            echo "::error file=tests/vitest::vitest 失败 ${COUNT} 条（文件去重后见上），尾部：${TAIL}"
            exit 1
          }

  build:
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: x64
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # #88 的实测把「npm ci 挂」定位到安装脚本这一段：同一个 lockfile 下
      # `npm ci --ignore-scripts` 在 ubuntu 上 64s 成功，带脚本的 `npm ci` 在
      # ubuntu/win/mac **六个矩阵项全部**在约 2 分钟失败。这里把两段拆开：
      #   ① 装依赖（不跑脚本）——纯 registry 下载；
      #   ② 显式 `install-app-deps`——按 Electron ABI 重编原生模块（要 headers）。
      # 哪一段红一目了然，也避免一次失败把两个原因混在一起。
      - name: npm ci（不跑安装脚本）
        shell: bash
        run: |
          set -o pipefail
          npm ci --ignore-scripts 2>&1 | tee /tmp/npm-ci.log || {
            TAIL=$(tail -40 /tmp/npm-ci.log | tr '\n' '|' | cut -c1-900)
            echo "::error file=package-lock.json::npm ci failed: ${TAIL}"
            exit 1
          }
      - name: 按 Electron ABI 重建原生模块
        shell: bash
        run: |
          # #89 实测：install-app-deps 在这四行之前就崩了——
          #   ⨯ ENOENT: no such file or directory, stat '.../node_modules/sharp'
          # `sharp` 是 @xenova/transformers 自带的桩包（name=sharp-stub）。锁文件把它记成
          # `node_modules/sharp → node_modules/@xenova/transformers/stubs/sharp` 的软链；
          # npm ci 下这个链会缺失/悬空，而 @electron/rebuild 会逐个 stat `node_modules/*`
          # 找原生模块，stat 一个不存在的路径直接整步失败。先清掉悬空链（`-e` 会跟随符号
          # 链接：悬空时为假），再重建。注意这不是「删依赖」——真 sharp 从未安装过。
          if [ ! -e node_modules/sharp ]; then rm -rf node_modules/sharp; echo "removed dangling node_modules/sharp link"; fi
          set -o pipefail
          npx electron-builder install-app-deps 2>&1 | tee /tmp/app-deps.log || {
            TAIL=$(tail -40 /tmp/app-deps.log | tr '\n' '|' | cut -c1-900)
            echo "::error file=package.json::install-app-deps failed: ${TAIL}"
            exit 1
          }
      - run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify packaged agent runtime (macOS)
        if: runner.os == 'macOS'
        run: npm run verify:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: BizGraph-${{ matrix.os }}-${{ matrix.arch }}
          path: release/**/*

  e2e:
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-13]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # e2e 跑的是浏览器版 Playwright（`playwright.browser.config.ts` 用 vite dev
      # server + 页面内 mock IPC），不需要 Electron 二进制、也不加载原生模块，
      # 所以同样跳过安装脚本——#88 三个平台的 `npm ci` 都是在脚本阶段挂的。
      - name: npm ci（e2e 不需要安装脚本）
        shell: bash
        run: |
          set -o pipefail
          npm ci --ignore-scripts 2>&1 | tee /tmp/npm-ci.log || {
            TAIL=$(tail -40 /tmp/npm-ci.log | tr '\n' '|' | cut -c1-900)
            echo "::error file=package-lock.json::npm ci failed: ${TAIL}"
            exit 1
          }
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # #89：装依赖已不再是瓶颈（本步真的跑起来了），失败在用例本身，同样看不到日志。
      # 把 Playwright 列出的失败用例名与日志尾部写进注解（每步 error 注解上限 10 条）。
      - name: Run E2E tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          npx xvfb-run npm run test:e2e 2>&1 | tee /tmp/e2e.log || {
            grep -aE '^[[:space:]]*[0-9]+\) ' /tmp/e2e.log | head -6 | while IFS= read -r line; do
              echo "::error file=tests/e2e::${line}"
            done
            TAIL=$(tail -30 /tmp/e2e.log | tr '\n' '|' | cut -c1-800)
            echo "::error file=tests/e2e::e2e failed，尾部：${TAIL}"
            exit 1
          }
      - name: Run E2E tests (macOS/Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee /tmp/e2e.log || {
            grep -aE '^[[:space:]]*[0-9]+\) ' /tmp/e2e.log | head -6 | while IFS= read -r line; do
              echo "::error file=tests/e2e::${line}"
            done
            TAIL=$(tail -30 /tmp/e2e.log | tr '\n' '|' | cut -c1-800)
            echo "::error file=tests/e2e::e2e failed，尾部：${TAIL}"
            exit 1
          }

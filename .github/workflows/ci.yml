name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # verify:blueprint 会用 `git cat-file -e <sha>` 核对蓝图里引用的历史提交号，
      # 而 actions/checkout 默认 shallow（depth=1）只带当前提交，历史 sha 一律解析失败
      # → 该断言在 CI 上必然误红。这里拉全量历史（本仓 .git 仅 ~60MB）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # lint 只跑 eslint/tsc/蓝图断言：不启动 Electron、也不加载原生模块，
      # 因此跳过全部安装脚本（--ignore-scripts）。这一步同时关掉两个纯网络性失败点：
      #   ① electron 二进制下载（走 github release，~110MB）；
      #   ② 根 postinstall = `electron-builder install-app-deps`，会用 node-gyp 按
      #      Electron ABI 重编 better-sqlite3，还得额外拉 headers。
      # 失败时把 npm 的真实输出尾部送进注解：npm 的 `_logs/*-debug-0.log` 里并不含
      # `npm error` 行（那是 CLI 的 stderr 格式），此前按它 grep 只会抓到空。
      - name: npm ci（lint 不需要安装脚本与原生构建）
        shell: bash
        run: |
          set -o pipefail
          npm ci --ignore-scripts 2>&1 | tee /tmp/npm-ci.log || {
            TAIL=$(tail -40 /tmp/npm-ci.log | tr '\n' '|' | cut -c1-900)
            echo "::error file=package-lock.json::npm ci failed: ${TAIL}"
            exit 1
          }
      - run: npm run lint
      - run: npx tsc --noEmit
      # 蓝图的机械断言（I.2 行数/编号闭合、计数三等式、文件与提交号可解析、
      # 行数声明=实测）。纯 node 脚本、秒级，防止文档口径随代码漂移。
      - run: npm run verify:blueprint

  # G4-9：vitest 单测。先以 continue-on-error 观测，不直接卡门。
  # 现状（2026-11-13，本地 Node 22 / macOS，--maxWorkers=4 实测，含 FR-S1-02 新增测试）：
  #   396 文件（389 通过 / 7 整文件 skip）；4709 例（4646 通过 / 63 skip / 0 失败）。
  #   Linux runner 同日实测（run 43404874196，全绿）：
  #   396 文件（390 通过 / 6 整文件 skip）/ 0 失败 / 78.45s。
  #   ⚠️ 两个平台的 skip 集合不同（有 1 个文件只在 macOS skip），别按「跳过数」比对。
  # #90 在 Linux 上的实测结论（容器内复现，非猜测）：
  #   - 15 个文件整文件收集失败，报 `Cannot find package 'sharp'`：锁文件把 sharp 记成
  #     `node_modules/sharp → node_modules/@xenova/transformers/stubs/sharp`，而 npm ci
  #     不会创建那个目标（本地有是因为早先 npm install 顺手建过）。已改为普通
  #     `file:stubs/sharp` 直接依赖，npm ci 后链接指向 `../stubs/sharp`，可解析。
  #   - 另有一批 `Electron failed to install correctly`：--ignore-scripts 下没有 dist/，
  #     故下面显式补一次二进制下载。
  # 观测一轮全绿后，删除 continue-on-error 正式作为门禁。
  unit:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 同 lint：跳过安装脚本，避免根 postinstall 按 Electron ABI 重编原生模块；
      # 但单测跑在 Node 20 上、真的要用 better-sqlite3，故按 Node ABI 单独重建这一个。
      - name: npm ci（跳过安装脚本）
        run: npm ci --ignore-scripts
      - name: 按 Node ABI 重建 better-sqlite3
        run: npm rebuild better-sqlite3
      # 大量用例直接 import electron（app.getPath 等）。--ignore-scripts 下 electron 包
      # 没有 dist/，require 会抛 "Electron failed to install correctly"，整个文件收集失败。
      # 只补二进制下载（~110MB），不跑 electron-builder、不重编原生模块。
      - name: 补 Electron 二进制
        run: node node_modules/electron/install.js
      # --maxWorkers=4 与本地已验证的跑法一致：默认并发在本机会因 worker 起不来
      # 静默丢测试文件（342 vs 384），显式限并发才能拿到可信的「全量」。
      - name: Run unit tests (vitest, includes tests/migration P1–P9 / G4-6)
        run: npx vitest run --reporter=default --reporter=json --outputFile.json=/tmp/vitest.json --maxWorkers=4
      # Actions 的 job 日志 API 要 admin（403），注解是匿名唯一可读的通道，且每步上限
      # 10 条 error 注解 —— 由脚本按文件去重压到 8 条，再补一条计数汇总。
      - name: 单测失败清单 → 注解
        if: failure()
        run: node scripts/ci-annotate-failures.mjs vitest /tmp/vitest.json

  # G9-13：Windows 路径语义必须在**真实 NTFS** 上验。纯函数用例（显式传
  # `windows=true`）只证明「给定 Windows 形状的字符串算得对」，证明不了
  # `fs.realpathSync` 返回的规范大小写、跨盘时 `path.relative` 返回绝对路径、
  # 盘符前缀旁路（`C:\project-evil` 以 `C:\project` 开头）这些宿主行为。
  #
  # 单独成 job 而不是并进 unit：unit 跑在 ubuntu 上，Windows 语义在那里没有宿主可验。
  # 也不重建 better-sqlite3 —— 这组测试不碰原生模块，而 Windows 上那一步要 MSVC
  # 工具链，纯属额外失败面。需要真实建库的 `graph-service-project-path.test.ts`
  # 因此不在本 job 内（它验的是 project_path 落库，不是 Windows 路径语义）。
  platform-paths:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm ci（只需要运行时依赖）
        run: npm ci --ignore-scripts
      # 若宿主不是 Windows，整块 Windows 用例会 skip 而 job 变绿 —— 那是假绿。
      # 显式断言一次，让「跑错平台」直接红。
      - name: 断言宿主是 Windows
        shell: bash
        run: |
          node -e "if (process.platform !== 'win32') { console.log('::error::platform-paths 必须跑在 Windows 上，实际 ' + process.platform); process.exit(1) }"
      - name: Windows 路径语义
        run: >-
          npx vitest run
          src/main/__tests__/path-windows.test.ts
          src/main/__tests__/path-utils.test.ts
          src/shared/__tests__/project-path.test.ts
          src/renderer/lib/__tests__/project-paths.test.ts
          --reporter=default --reporter=json
          --outputFile.json=${{ runner.temp }}/vitest-paths.json
      - name: 失败清单 → 注解
        if: failure()
        run: node scripts/ci-annotate-failures.mjs vitest "${{ runner.temp }}/vitest-paths.json"

  build:
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 14 镜像已于 2026-11-02 全面退役，macos-13 更早下线：用这两个标签的
          # job 要么被立刻取消（注解原文 `The configuration 'macos-14-arm64-us-default'
          # is not supported`），要么永远 queued。现行标签是 macos-15 / macos-15-intel。
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # #88 的实测把「npm ci 挂」定位到安装脚本这一段：同一个 lockfile 下
      # `npm ci --ignore-scripts` 在 ubuntu 上 64s 成功，带脚本的 `npm ci` 在
      # ubuntu/win/mac **六个矩阵项全部**在约 2 分钟失败。这里把两段拆开：
      #   ① 装依赖（不跑脚本）——纯 registry 下载；
      #   ② 显式 `install-app-deps`——按 Electron ABI 重编原生模块（要 headers）。
      # 哪一段红一目了然，也避免一次失败把两个原因混在一起。
      - name: npm ci（不跑安装脚本）
        shell: bash
        run: |
          set -o pipefail
          npm ci --ignore-scripts 2>&1 | tee /tmp/npm-ci.log || {
            TAIL=$(tail -40 /tmp/npm-ci.log | tr '\n' '|' | cut -c1-900)
            echo "::error file=package-lock.json::npm ci failed: ${TAIL}"
            exit 1
          }
      - name: 按 Electron ABI 重建原生模块
        shell: bash
        run: |
          # #89 时这一步死在 `⨯ ENOENT: stat '.../node_modules/sharp'`：锁文件把 sharp
          # 记成指向 `@xenova/transformers/stubs/sharp` 的软链，npm ci 不创建该目标，
          # 而 @electron/rebuild 会逐个 stat `node_modules/*`。根因已在 package.json /
          # lockfile 里修掉（改成 `file:stubs/sharp` 直接依赖，链接指向仓库内真实目录），
          # 这里不再需要额外的清理动作。
          set -o pipefail
          npx electron-builder install-app-deps 2>&1 | tee /tmp/app-deps.log || {
            TAIL=$(tail -40 /tmp/app-deps.log | tr '\n' '|' | cut -c1-900)
            echo "::error file=package.json::install-app-deps failed: ${TAIL}"
            exit 1
          }
      - run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify packaged agent runtime (macOS)
        if: runner.os == 'macOS'
        run: npm run verify:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: BizGraph-${{ matrix.os }}-${{ matrix.arch }}
          path: release/**/*

  e2e:
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # macos-13 已下线（job 永远 queued），改用现行的 x64 标签 macos-15-intel。
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # e2e 跑的是浏览器版 Playwright（`playwright.browser.config.ts` 用 vite dev
      # server + 页面内 mock IPC），不需要 Electron 二进制、也不加载原生模块，
      # 所以同样跳过安装脚本——#88 三个平台的 `npm ci` 都是在脚本阶段挂的。
      - name: npm ci（e2e 不需要安装脚本）
        shell: bash
        run: |
          set -o pipefail
          npm ci --ignore-scripts 2>&1 | tee /tmp/npm-ci.log || {
            TAIL=$(tail -40 /tmp/npm-ci.log | tr '\n' '|' | cut -c1-900)
            echo "::error file=package-lock.json::npm ci failed: ${TAIL}"
            exit 1
          }
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # 不用 xvfb：Playwright 的 chromium 默认 headless（且默认关沙箱），不需要 X server。
      # #90 的 Linux e2e 只跑了 1 秒就红，原因就是 `npx xvfb-run …` —— npx 会去 npm 上
      # 找一个同名的包，而 xvfb-run 是系统程序，必然失败。
      #
      # #90 的 24/26 失败也**不是**平台差异：`npm run dev` 会经 vite-plugin-electron
      # 起一个 Electron 子进程，插件里 `process.electronApp.once("exit", process.exit)`
      # 会在子进程退出时把 dev server 一起带走（CI 上必然退出：--ignore-scripts 没下
      # Electron 二进制）。所以 playwright 配置用 webServer.env 注入
      # BIZGRAPH_BROWSER_E2E=1，让 vite.config.ts 跳过 electron 插件。
      #
      # 失败清单走 json reporter + 注解（Actions 日志 API 需 admin，注解匿名可读）。
      - name: Run E2E tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: /tmp/e2e.json
        run: npx playwright test -c tests/e2e/playwright.browser.config.ts --reporter=line --reporter=json
      - name: e2e 失败清单 → 注解
        if: failure()
        run: node scripts/ci-annotate-failures.mjs playwright /tmp/e2e.json

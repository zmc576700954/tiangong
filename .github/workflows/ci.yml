name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  # G4-9：vitest 单测。先以 continue-on-error 观测，不直接卡门。
  # 理由：本地全量稳定（316 files / 3892 passed / 3 skipped，约 16s），但这是本套
  # 单测首次进 CI：better-sqlite3 原生模块 ABI、真实 git 探针、策略延迟预算、
  # P2 重建耗时阈值等都依赖 runner 环境，尚未在 ubuntu-latest 验证过。
  # 观测一轮全绿后，删除 continue-on-error 正式作为门禁。
  unit:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Run unit tests (vitest, includes tests/migration P1–P9 / G4-6)
        run: npx vitest run --reporter=default

  build:
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: x64
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify packaged agent runtime (macOS)
        if: runner.os == 'macOS'
        run: npm run verify:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: BizGraph-${{ matrix.os }}-${{ matrix.arch }}
          path: release/**/*

  e2e:
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-13]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests (Linux)
        if: runner.os == 'Linux'
        run: npx xvfb-run npm run test:e2e
      - name: Run E2E tests (macOS/Windows)
        if: runner.os != 'Linux'
        run: npm run test:e2e

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # verify:blueprint 会用 `git cat-file -e <sha>` 核对蓝图里引用的历史提交号，
      # 而 actions/checkout 默认 shallow（depth=1）只带当前提交，历史 sha 一律解析失败
      # → 该断言在 CI 上必然误红。这里拉全量历史（本仓 .git 仅 ~60MB）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # lint 只跑 eslint/tsc/蓝图断言：不启动 Electron、也不加载原生模块，
      # 因此跳过全部安装脚本（--ignore-scripts）。这一步同时关掉两个纯网络性失败点：
      #   ① electron 二进制下载（走 github release，~110MB）；
      #   ② 根 postinstall = `electron-builder install-app-deps`，会用 node-gyp 按
      #      Electron ABI 重编 better-sqlite3，还得额外拉 headers。
      # 失败时把 npm 的真实输出尾部送进注解：npm 的 `_logs/*-debug-0.log` 里并不含
      # `npm error` 行（那是 CLI 的 stderr 格式），此前按它 grep 只会抓到空。
      - name: npm ci（lint 不需要安装脚本与原生构建）
        shell: bash
        run: |
          set -o pipefail
          npm ci --ignore-scripts 2>&1 | tee /tmp/npm-ci.log || {
            TAIL=$(tail -40 /tmp/npm-ci.log | tr '\n' '|' | cut -c1-900)
            echo "::error file=package-lock.json::npm ci failed: ${TAIL}"
            exit 1
          }
      - run: npm run lint
      - run: npx tsc --noEmit
      # 蓝图的机械断言（I.2 行数/编号闭合、计数三等式、文件与提交号可解析、
      # 行数声明=实测）。纯 node 脚本、秒级，防止文档口径随代码漂移。
      - run: npm run verify:blueprint

  # G4-9：vitest 单测。先以 continue-on-error 观测，不直接卡门。
  # 现状（2026-11-12，本地 Node 22 / macOS）：352 文件 / 4244 例，
  # 4198 通过 / 46 跳过（宿主能力缺失，逐条带原因）/ 0 失败，耗时约 3'40"。
  # 仍未在 ubuntu-latest 验证过的点：
  #   - better-sqlite3 预编译 ABI 与 setup-node 20 是否匹配（npm ci 时决定）；
  #   - 进程归属类用例在 Linux 上会**首次真跑**（本机 ps 被拒 → 一直是 skip）；
  #   - runner 只有 2 核，全量耗时可能翻数倍，故超时放到 30 分钟（不是放宽断言）。
  # 观测一轮全绿后，删除 continue-on-error 正式作为门禁。
  unit:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 同 lint：跳过安装脚本，避免根 postinstall 按 Electron ABI 重编原生模块；
      # 但单测跑在 Node 20 上、真的要用 better-sqlite3，故按 Node ABI 单独重建这一个。
      - name: npm ci（跳过安装脚本）
        run: npm ci --ignore-scripts
      - name: 按 Node ABI 重建 better-sqlite3
        run: npm rebuild better-sqlite3
      # --maxWorkers=4 与本地已验证的跑法一致：默认并发在本机会因 worker 起不来
      # 静默丢测试文件（342 vs 384），显式限并发才能拿到可信的「全量」。
      - name: Run unit tests (vitest, includes tests/migration P1–P9 / G4-6)
        run: npx vitest run --reporter=default --maxWorkers=4

  build:
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: x64
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify packaged agent runtime (macOS)
        if: runner.os == 'macOS'
        run: npm run verify:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: BizGraph-${{ matrix.os }}-${{ matrix.arch }}
          path: release/**/*

  e2e:
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-13]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests (Linux)
        if: runner.os == 'Linux'
        run: npx xvfb-run npm run test:e2e
      - name: Run E2E tests (macOS/Windows)
        if: runner.os != 'Linux'
        run: npm run test:e2e

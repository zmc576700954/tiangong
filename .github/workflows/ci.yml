name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # 蓝图的机械断言（I.2 行数/编号闭合、计数三等式、文件与提交号可解析、
      # 行数声明=实测）。纯 node 脚本、秒级，防止文档口径随代码漂移。
      - run: npm run verify:blueprint

  # G4-9：vitest 单测。先以 continue-on-error 观测，不直接卡门。
  # 现状（2026-11-12，本地 Node 22 / macOS）：352 文件 / 4244 例，
  # 4198 通过 / 46 跳过（宿主能力缺失，逐条带原因）/ 0 失败，耗时约 3'40"。
  # 仍未在 ubuntu-latest 验证过的点：
  #   - better-sqlite3 预编译 ABI 与 setup-node 20 是否匹配（npm ci 时决定）；
  #   - 进程归属类用例在 Linux 上会**首次真跑**（本机 ps 被拒 → 一直是 skip）；
  #   - runner 只有 2 核，全量耗时可能翻数倍，故超时放到 30 分钟（不是放宽断言）。
  # 观测一轮全绿后，删除 continue-on-error 正式作为门禁。
  unit:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Run unit tests (vitest, includes tests/migration P1–P9 / G4-6)
        run: npx vitest run --reporter=default

  build:
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: x64
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify packaged agent runtime (macOS)
        if: runner.os == 'macOS'
        run: npm run verify:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: BizGraph-${{ matrix.os }}-${{ matrix.arch }}
          path: release/**/*

  e2e:
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-13]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests (Linux)
        if: runner.os == 'Linux'
        run: npx xvfb-run npm run test:e2e
      - name: Run E2E tests (macOS/Windows)
        if: runner.os != 'Linux'
        run: npm run test:e2e
